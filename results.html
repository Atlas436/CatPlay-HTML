<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatPlay+ | Suas recomendações</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="barra-topo">
    <a class="marca" href="mode.html">
      <img src="assets/favicon.png" alt="" /> CatPlay+
    </a>
    <nav>
      <a href="biblioteca.html">Minha biblioteca</a>
      <a href="artigo.html">Artigo</a>
      <a href="perfil.html">Meu perfil</a>
      <button class="link" id="botao-sair">Sair</button>
    </nav>
  </header>

  <main class="conteudo">
    <div class="centralizado" style="margin-bottom: 40px">
      <h1 class="titulo" id="titulo-saudacao"></h1>
      <p class="subtitulo" id="subtitulo-selecao"></p>
    </div>

    <div id="area-resultados"></div>

    <div class="rodape-acoes">
      <a class="botao botao-primario" href="mode.html">Recomeçar / Trocar Seleção</a>
    </div>
  </main>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/data.js"></script>
  <script src="js/biblioteca.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/faixa.js"></script>
  <script>
    var sessao = exigirLogin();

    document.getElementById("botao-sair").addEventListener("click", function () {
      encerrarSessao();
      window.location.href = "index.html";
    });

    var parametros = new URLSearchParams(window.location.search);
    var tipo = parametros.get("tipo");
    var valor = parametros.get("valor");

    if (sessao) {
      document.getElementById("titulo-saudacao").textContent =
        "Aqui estão suas recomendações, " + sessao.nome + "!";
    }

    var listaOpcoes = tipo === "humor" ? HUMORES : GENEROS;
    var opcaoEscolhida = listaOpcoes.filter(function (o) {
      return o.chave === valor;
    })[0];

    if (opcaoEscolhida) {
      document.getElementById("subtitulo-selecao").innerHTML =
        '<span class="emoji">' + opcaoEscolhida.emoji + "</span> " + opcaoEscolhida.rotulo;
    }

    montarResultados();

    async function montarResultados() {
      var itensFiltrados = await buscarItens(tipo, valor);

      var area = document.getElementById("area-resultados");

      if (itensFiltrados.length === 0) {
        area.innerHTML =
          '<p class="centralizado">Ainda não temos recomendações para essa combinação. Tente outra opção!</p>';
      }

      function criarCard(item) {
        var card = document.createElement("article");
        card.className = "midia-card";
        card.setAttribute("data-codigo", "CP-" + String(item.id).padStart(4, "0"));

        var cabecalho = document.createElement("div");
        cabecalho.className = "cabecalho-card";

        var h3 = document.createElement("h3");
        h3.textContent = item.titulo;
        cabecalho.appendChild(h3);

        var tipoEtiqueta = document.createElement("span");
        tipoEtiqueta.className = "tipo-etiqueta";
        tipoEtiqueta.textContent = item.tipo;
        cabecalho.appendChild(tipoEtiqueta);

        card.appendChild(cabecalho);

        var sinopse = document.createElement("p");
        sinopse.textContent = item.sinopse;
        card.appendChild(sinopse);

        var tagsDiv = document.createElement("div");
        tagsDiv.className = "tags";
        item.tags.forEach(function (tag) {
          var tagSpan = document.createElement("span");
          tagSpan.className = "tag";
          tagSpan.textContent = "#" + tag;
          tagsDiv.appendChild(tagSpan);
        });
        card.appendChild(tagsDiv);

        var controles = document.createElement("div");
        controles.className = "controles-biblioteca";

        var select = document.createElement("select");
        select.className = "select-status";
        STATUS_BIBLIOTECA.forEach(function (s) {
          var opcao = document.createElement("option");
          opcao.value = s.chave;
          opcao.textContent = s.rotulo;
          select.appendChild(opcao);
        });
        controles.appendChild(select);

        var botaoAdicionar = document.createElement("button");
        botaoAdicionar.type = "button";
        botaoAdicionar.className = "botao botao-secundario botao-adicionar";
        botaoAdicionar.textContent = "+ Minha biblioteca";
        controles.appendChild(botaoAdicionar);

        var botaoParecidos = document.createElement("button");
        botaoParecidos.type = "button";
        botaoParecidos.className = "botao botao-secundario botao-parecidos";
        botaoParecidos.textContent = "Ver parecidos";
        controles.appendChild(botaoParecidos);

        card.appendChild(controles);

        var mensagem = document.createElement("p");
        mensagem.className = "mensagem-biblioteca";
        card.appendChild(mensagem);

        var areaParecidos = document.createElement("div");
        areaParecidos.className = "recomendacoes-cruzadas";
        card.appendChild(areaParecidos);

        botaoAdicionar.addEventListener("click", async function () {
          botaoAdicionar.disabled = true;
          var ok = await adicionarNaBiblioteca(sessao.id, sessao.token, item.id, select.value);
          mensagem.textContent = ok
            ? "Adicionado à sua biblioteca!"
            : "Não deu pra adicionar, tenta de novo.";
          mensagem.className = "mensagem-biblioteca " + (ok ? "sucesso" : "erro");
          botaoAdicionar.disabled = false;
        });

        botaoParecidos.addEventListener("click", async function () {
          if (areaParecidos.childElementCount > 0) {
            areaParecidos.innerHTML = "";
            botaoParecidos.textContent = "Ver parecidos";
            return;
          }

          botaoParecidos.disabled = true;
          botaoParecidos.textContent = "Buscando...";
          var parecidos = await buscarRecomendacoesCruzadas(item);
          botaoParecidos.disabled = false;
          botaoParecidos.textContent = "Esconder parecidos";

          if (parecidos.length === 0) {
            var aviso = document.createElement("p");
            aviso.className = "texto-ajuda";
            aviso.textContent = "Ainda não achamos nada parecido de outro tipo de mídia.";
            areaParecidos.appendChild(aviso);
            return;
          }

          var legenda = document.createElement("p");
          legenda.className = "texto-ajuda";
          legenda.style.marginBottom = "6px";
          legenda.textContent = "Porque você curtiu isso:";
          areaParecidos.appendChild(legenda);

          parecidos.forEach(function (p) {
            var linha = document.createElement("div");
            linha.className = "item-parecido";

            var etiqueta = document.createElement("span");
            etiqueta.className = "tipo-etiqueta";
            etiqueta.textContent = p.tipo;
            linha.appendChild(etiqueta);

            var forte = document.createElement("strong");
            forte.textContent = p.titulo;
            linha.appendChild(forte);

            areaParecidos.appendChild(linha);
          });
        });

        return card;
      }

      TIPOS_MIDIA.forEach(function (tipoMidia) {
        var itensDoTipo = itensFiltrados.filter(function (item) {
          return item.tipo === tipoMidia;
        });
        if (itensDoTipo.length === 0) return;

        var secao = document.createElement("section");
        secao.className = "secao-midia";

        var titulo = document.createElement("h2");
        titulo.textContent = ROTULOS_TIPO[tipoMidia];
        secao.appendChild(titulo);

        var grade = document.createElement("div");
        grade.className = "grade-cards";

        itensDoTipo.forEach(function (item) {
          grade.appendChild(criarCard(item));
        });

        secao.appendChild(grade);
        area.appendChild(secao);
      });
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatPlay+ | Suas recomendações</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="barra-topo">
    <a class="marca" href="mode.html">
      <img src="assets/favicon.png" alt="" /> CatPlay+
    </a>
    <nav>
      <a href="biblioteca.html">Minha biblioteca</a>
      <a href="artigo.html">Artigo</a>
      <a href="perfil.html">Meu perfil</a>
      <button class="link" id="botao-sair">Sair</button>
    </nav>
  </header>

  <main class="conteudo">
    <div class="centralizado" style="margin-bottom: 40px">
      <h1 class="titulo" id="titulo-saudacao"></h1>
      <p class="subtitulo" id="subtitulo-selecao"></p>
    </div>

    <div id="area-resultados"></div>

    <div class="rodape-acoes">
      <a class="botao botao-primario" href="mode.html">Recomeçar / Trocar Seleção</a>
    </div>
  </main>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/data.js"></script>
  <script src="js/biblioteca.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/faixa.js"></script>
  <script>
    var sessao = exigirLogin();

    document.getElementById("botao-sair").addEventListener("click", function () {
      encerrarSessao();
      window.location.href = "index.html";
    });

    var parametros = new URLSearchParams(window.location.search);
    var tipo = parametros.get("tipo");
    var valor = parametros.get("valor");

    if (sessao) {
      document.getElementById("titulo-saudacao").textContent =
        "Aqui estão suas recomendações, " + sessao.nome + "!";
    }

    var listaOpcoes = tipo === "humor" ? HUMORES : GENEROS;
    var opcaoEscolhida = listaOpcoes.filter(function (o) {
      return o.chave === valor;
    })[0];

    if (opcaoEscolhida) {
      document.getElementById("subtitulo-selecao").innerHTML =
        '<span class="emoji">' + opcaoEscolhida.emoji + "</span> " + opcaoEscolhida.rotulo;
    }

    montarResultados();

    async function montarResultados() {
      var itensFiltrados = await buscarItens(tipo, valor);

      var area = document.getElementById("area-resultados");

      if (itensFiltrados.length === 0) {
        area.innerHTML =
          '<p class="centralizado">Ainda não temos recomendações para essa combinação. Tente outra opção!</p>';
      }

      TIPOS_MIDIA.forEach(function (tipoMidia) {
        var itensDoTipo = itensFiltrados.filter(function (item) {
          return item.tipo === tipoMidia;
        });
        if (itensDoTipo.length === 0) return;

        var secao = document.createElement("section");
        secao.className = "secao-midia";

        var titulo = document.createElement("h2");
        titulo.textContent = ROTULOS_TIPO[tipoMidia];
        secao.appendChild(titulo);

        var grade = document.createElement("div");
        grade.className = "grade-cards";

        itensDoTipo.forEach(function (item) {
          var card = document.createElement("article");
          card.className = "midia-card";
          card.setAttribute("data-codigo", "CP-" + String(item.id).padStart(4, "0"));

          var tagsHtml = item.tags
            .map(function (tag) {
              return '<span class="tag">#' + tag + "</span>";
            })
            .join("");

          var opcoesStatusHtml = STATUS_BIBLIOTECA.map(function (s) {
            return '<option value="' + s.chave + '">' + s.rotulo + "</option>";
          }).join("");

          card.innerHTML =
            '<div class="cabecalho-card">' +
            "<h3>" + item.titulo + "</h3>" +
            '<span class="tipo-etiqueta">' + item.tipo + "</span>" +
            "</div>" +
            "<p>" + item.sinopse + "</p>" +
            '<div class="tags">' + tagsHtml + "</div>" +
            '<div class="controles-biblioteca">' +
            '<select class="select-status">' + opcoesStatusHtml + "</select>" +
            '<button type="button" class="botao botao-secundario botao-adicionar">+ Minha biblioteca</button>' +
            '<button type="button" class="botao botao-secundario botao-parecidos">Ver parecidos</button>' +
            "</div>" +
            '<p class="mensagem-biblioteca"></p>' +
            '<div class="recomendacoes-cruzadas"></div>';

          var botaoAdicionar = card.querySelector(".botao-adicionar");
          botaoAdicionar.addEventListener("click", async function () {
            var statusEscolhido = card.querySelector(".select-status").value;
            var mensagem = card.querySelector(".mensagem-biblioteca");
            botaoAdicionar.disabled = true;
            var ok = await adicionarNaBiblioteca(sessao.id, item.id, statusEscolhido);
            mensagem.textContent = ok
              ? "Adicionado à sua biblioteca!"
              : "Não deu pra adicionar, tenta de novo.";
            mensagem.className = "mensagem-biblioteca " + (ok ? "sucesso" : "erro");
            botaoAdicionar.disabled = false;
          });

          var botaoParecidos = card.querySelector(".botao-parecidos");
          var areaParecidos = card.querySelector(".recomendacoes-cruzadas");
          botaoParecidos.addEventListener("click", async function () {
            if (areaParecidos.childElementCount > 0) {
              areaParecidos.innerHTML = "";
              botaoParecidos.textContent = "Ver parecidos";
              return;
            }

            botaoParecidos.disabled = true;
            botaoParecidos.textContent = "Buscando...";
            var parecidos = await buscarRecomendacoesCruzadas(item);
            botaoParecidos.disabled = false;
            botaoParecidos.textContent = "Esconder parecidos";

            if (parecidos.length === 0) {
              areaParecidos.innerHTML =
                '<p class="texto-ajuda">Ainda não achamos nada parecido de outro tipo de mídia.</p>';
              return;
            }

            areaParecidos.innerHTML =
              '<p class="texto-ajuda" style="margin-bottom: 6px">Porque você curtiu isso:</p>' +
              parecidos
                .map(function (p) {
                  return (
                    '<div class="item-parecido">' +
                    '<span class="tipo-etiqueta">' + p.tipo + "</span>" +
                    "<strong>" + p.titulo + "</strong>" +
                    "</div>"
                  );
                })
                .join("");
          });

          grade.appendChild(card);
        });

        secao.appendChild(grade);
        area.appendChild(secao);
      });
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatPlay+ | Entrar</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="tela">
    <img src="assets/logo.jpg" alt="CatPlay+" class="logo" />

    <a href="mvp/index.html" class="botao botao-secundario" style="margin-bottom: 20px">
      Ver MVP
    </a>

    <form class="caixa" id="form-login">
      <div id="area-erro"></div>

      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" autofocus required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />

      <button type="submit" class="botao-primario">Entrar</button>

      <p class="centralizado texto-ajuda" style="margin-top: 4px">
        Ainda não tem conta?
        <a class="link" href="cadastro.html">Criar conta</a>
      </p>
    </form>
  </div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/faixa.js"></script>
  <script>
    if (obterSessao()) {
      window.location.href = "mode.html";
    }

    var CHAVE_TENTATIVAS = "catplay_tentativas_login";
    var MAX_TENTATIVAS = 5;
    var BLOQUEIO_MS = 30000;

    function obterTentativas() {
      var dados = localStorage.getItem(CHAVE_TENTATIVAS);
      return dados ? JSON.parse(dados) : { quantidade: 0, bloqueadoAte: 0 };
    }

    function salvarTentativas(tentativas) {
      localStorage.setItem(CHAVE_TENTATIVAS, JSON.stringify(tentativas));
    }

    document.getElementById("form-login").addEventListener("submit", async function (evento) {
      evento.preventDefault();
      var areaErro = document.getElementById("area-erro");
      var tentativas = obterTentativas();

      if (Date.now() < tentativas.bloqueadoAte) {
        var segundosRestantes = Math.ceil((tentativas.bloqueadoAte - Date.now()) / 1000);
        areaErro.innerHTML =
          '<p class="erro">Muitas tentativas erradas. Tente de novo em ' + segundosRestantes + "s.</p>";
        return;
      }

      var usuario = document.getElementById("usuario").value;
      var senha = document.getElementById("senha").value;

      var encontrado = await autenticar(usuario, senha);

      if (!encontrado) {
        tentativas.quantidade += 1;
        if (tentativas.quantidade >= MAX_TENTATIVAS) {
          tentativas = { quantidade: 0, bloqueadoAte: Date.now() + BLOQUEIO_MS };
        }
        salvarTentativas(tentativas);
        areaErro.innerHTML = '<p class="erro">Usuário ou senha inválidos.</p>';
        return;
      }

      salvarTentativas({ quantidade: 0, bloqueadoAte: 0 });
      definirSessao(encontrado);
      window.location.href = "mode.html";
    });
  </script>
</body>
</html>

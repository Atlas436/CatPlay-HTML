<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatPlay+ | Entrar</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="tela">
    <img src="assets/logo.svg" alt="CatPlay+" class="logo" />

    <form class="caixa" id="form-login">
      <div id="area-erro"></div>

      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" autofocus required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />

      <button type="submit" class="botao-primario">Entrar</button>

      <p class="centralizado texto-ajuda" style="margin-top: 4px">
        Ainda não tem conta?
        <a class="link" href="cadastro.html">Criar conta</a>
      </p>
    </form>
  </div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // se já estiver logado, vai direto pra tela de modo
    if (obterSessao()) {
      window.location.href = "mode.html";
    }

    document.getElementById("form-login").addEventListener("submit", async function (evento) {
      evento.preventDefault();
      var usuario = document.getElementById("usuario").value;
      var senha = document.getElementById("senha").value;

      var encontrado = await autenticar(usuario, senha);
      var areaErro = document.getElementById("area-erro");

      if (!encontrado) {
        areaErro.innerHTML = '<p class="erro">Usuário ou senha inválidos.</p>';
        return;
      }

      definirSessao(encontrado);
      window.location.href = "mode.html";
    });
  </script>
</body>
</html>

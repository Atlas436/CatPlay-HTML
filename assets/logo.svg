<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180">
  <!-- wordmark brutalista: tipografia pesada, alto contraste -->
  <text x="10" y="110" font-family="'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="100" letter-spacing="-2" fill="#111111">CAT<tspan fill="#ff6c1a">PLAY</tspan></text>

  <!-- "+" como selo, destacado -->
  <rect x="565" y="20" width="60" height="60" fill="#111111" />
  <text x="595" y="68" font-family="'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="52" fill="#ffd400" text-anchor="middle">+</text>

  <!-- barra inferior, tipo etiqueta/carimbo -->
  <rect x="10" y="140" width="615" height="10" fill="#111111" />
</svg>

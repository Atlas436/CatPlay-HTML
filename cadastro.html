<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatPlay+ | Criar conta</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="tela">
    <img src="assets/logo.svg" alt="CatPlay+" class="logo" />

    <form class="caixa" id="form-cadastro">
      <h1 class="titulo" style="font-size: 1.3rem; margin-bottom: 0">Criar conta</h1>
      <div id="area-erro"></div>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome" autofocus required />

      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" placeholder="Escolha um nome de usuário" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required minlength="4" />

      <label for="confirmar-senha">Confirmar senha</label>
      <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha" required />

      <button type="submit" class="botao-primario">Cadastrar</button>

      <p class="centralizado texto-ajuda" style="margin-top: 4px">
        Já tem conta?
        <a class="link" href="index.html">Entrar</a>
      </p>
    </form>
  </div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("form-cadastro").addEventListener("submit", async function (evento) {
      evento.preventDefault();

      var nome = document.getElementById("nome").value;
      var usuario = document.getElementById("usuario").value;
      var senha = document.getElementById("senha").value;
      var confirmarSenha = document.getElementById("confirmar-senha").value;
      var areaErro = document.getElementById("area-erro");

      if (senha !== confirmarSenha) {
        areaErro.innerHTML = '<p class="erro">As senhas não coincidem.</p>';
        return;
      }

      var resultado = await cadastrarUsuario(nome, usuario, senha);
      if (!resultado.ok) {
        areaErro.innerHTML = '<p class="erro">' + resultado.erro + "</p>";
        return;
      }

      // cadastro deu certo: já loga o usuário automaticamente
      var usuarioCriado = await autenticar(usuario, senha);
      definirSessao(usuarioCriado);
      window.location.href = "mode.html";
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CatPlay+ | Minha biblioteca</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="barra-topo">
    <a class="marca" href="mode.html">
      <img src="assets/favicon.png" alt="" /> CatPlay+
    </a>
    <nav>
      <a href="mode.html">Início</a>
      <a href="artigo.html">Artigo</a>
      <a href="perfil.html">Meu perfil</a>
      <button class="link" id="botao-sair">Sair</button>
    </nav>
  </header>

  <main class="conteudo">
    <div class="centralizado" style="margin-bottom: 40px">
      <h1 class="titulo">Minha biblioteca</h1>
      <p class="subtitulo">Tudo que você já assistiu, leu ou jogou (ou pretende)</p>
    </div>

    <div id="area-biblioteca"></div>
  </main>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/data.js"></script>
  <script src="js/biblioteca.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/faixa.js"></script>
  <script>
    var sessao = exigirLogin();

    document.getElementById("botao-sair").addEventListener("click", function () {
      encerrarSessao();
      window.location.href = "index.html";
    });

    var area = document.getElementById("area-biblioteca");

    function rotuloStatus(chave) {
      var item = STATUS_BIBLIOTECA.filter(function (s) {
        return s.chave === chave;
      })[0];
      return item ? item.rotulo : chave;
    }

    function criarCard(registro) {
      var item = registro.itens;

      var card = document.createElement("article");
      card.className = "midia-card";
      card.setAttribute("data-codigo", "CP-" + String(item.id).padStart(4, "0"));

      var cabecalho = document.createElement("div");
      cabecalho.className = "cabecalho-card";

      var h3 = document.createElement("h3");
      h3.textContent = item.titulo;
      cabecalho.appendChild(h3);

      var tipoEtiqueta = document.createElement("span");
      tipoEtiqueta.className = "tipo-etiqueta";
      tipoEtiqueta.textContent = item.tipo;
      cabecalho.appendChild(tipoEtiqueta);

      card.appendChild(cabecalho);

      var sinopse = document.createElement("p");
      sinopse.textContent = item.sinopse;
      card.appendChild(sinopse);

      var controles = document.createElement("div");
      controles.className = "controles-biblioteca";

      var select = document.createElement("select");
      select.className = "select-status";
      STATUS_BIBLIOTECA.forEach(function (s) {
        var opcao = document.createElement("option");
        opcao.value = s.chave;
        opcao.textContent = s.rotulo;
        if (s.chave === registro.status) opcao.selected = true;
        select.appendChild(opcao);
      });
      controles.appendChild(select);

      var botaoRemover = document.createElement("button");
      botaoRemover.type = "button";
      botaoRemover.className = "botao botao-perigo botao-remover";
      botaoRemover.textContent = "Remover";
      controles.appendChild(botaoRemover);

      card.appendChild(controles);

      select.addEventListener("change", async function (evento) {
        await atualizarStatusBiblioteca(sessao.id, sessao.token, registro.id, evento.target.value);
      });

      botaoRemover.addEventListener("click", async function () {
        var confirmou = window.confirm('Remover "' + item.titulo + '" da sua biblioteca?');
        if (!confirmou) return;
        await removerDaBiblioteca(sessao.id, sessao.token, registro.id);
        card.remove();
      });

      return card;
    }

    async function montarBiblioteca() {
      var registros = await obterMinhaBiblioteca(sessao.id, sessao.token);

      if (registros.length === 0) {
        area.innerHTML =
          '<p class="centralizado">Sua biblioteca está vazia por enquanto. Vá em "Início" e adicione algo às suas recomendações!</p>';
        return;
      }

      var grade = document.createElement("div");
      grade.className = "grade-cards";

      registros.forEach(function (registro) {
        if (!registro.itens) return;
        grade.appendChild(criarCard(registro));
      });

      area.innerHTML = "";
      area.appendChild(grade);
    }

    montarBiblioteca();
  </script>
</body>
</html>
